name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # necessário para publicar o APK em Releases

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_RELEASE_KEY: ${{ secrets.APEX_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (o runner já traz o SDK; garante plataforma 35)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v5
      - name: Testes unitários
        run: ./gradlew test
      - name: Testes do analisador btsnoop
        run: python3 tools/test_btsnoop_gatt.py
      - name: APK debug
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk apex-led.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk apex-led-relogio.apk
      - uses: actions/upload-artifact@v6
        with:
          name: apex-led-debug-apk
          path: |
            apex-led.apk
            apex-led-relogio.apk

      # Pacotes para a Play Store (.aab), só se os secrets da chave existirem. Ver docs/play-store.md.
      - name: Pacotes da Play Store
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEY == 'true'
        env:
          APEX_KEYSTORE_B64: ${{ secrets.APEX_KEYSTORE_B64 }}
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
        run: |
          echo "$APEX_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/apex.jks"
          export APEX_KEYSTORE_FILE="$RUNNER_TEMP/apex.jks"
          ./gradlew :app:bundleRelease :wear:bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab apex-led-celular.aab
          cp wear/build/outputs/bundle/release/wear-release.aab apex-led-relogio.aab
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request' && hashFiles('apex-led-celular.aab') != ''
        with:
          name: apex-led-play-store
          path: "*.aab"

      # Publica o APK num link fixo, que abre direto no celular (sem zip e sem login):
      # https://github.com/amotsuka9999-web/apex-led/releases/latest/download/apex-led.apk
      - name: Publicar APK em Releases
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest apex-led.apk apex-led-relogio.apk \
            --target "$GITHUB_SHA" \
            --title "Apex LED v0.1.${GITHUB_RUN_NUMBER}" \
            --notes "Build automático do commit ${GITHUB_SHA::7} (branch ${GITHUB_REF_NAME}). apex-led.apk = celular; apex-led-relogio.apk = Galaxy Watch / Wear OS (instalar pelo celular, ver README)." \
            --latest

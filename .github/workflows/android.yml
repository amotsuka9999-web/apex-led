name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (o runner já traz o SDK; garante plataforma 35)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários
        run: ./gradlew test
      - name: Testes do analisador btsnoop
        run: python3 tools/test_btsnoop_gatt.py
      - name: APK debug
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apex-led-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
